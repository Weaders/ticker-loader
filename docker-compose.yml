services:
  postgres:
    image: postgres:16-alpine
    container_name: ticketloader-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ticketloader
    ports:
      - "5432:5432"
    volumes:
      - ticketloader_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ticketloader"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ticketloader_pgdata:
